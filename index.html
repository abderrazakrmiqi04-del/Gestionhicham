<title>Gestion Commerciale</title>

<style>
:root{
  --accent:#2f5d4f;
  --accent-dark:#203f36;
  --accent-soft:#e6ede9;
  --paper:#f6f7f5;
}
*{box-sizing:border-box;}
body{ background:var(--paper); font-size:14.5px; margin:0; }
#wrapper{ min-height:100vh; display:flex; }
.sidebar{
  width:220px; flex-shrink:0; background:var(--accent-dark); color:#e9efec;
  padding:22px 0; min-height:100vh; display:flex; flex-direction:column;
}
.sidebar-brand{
  font-size:16px; font-weight:600; padding:0 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:8px;
}
.sidebar-brand small{ display:block; font-weight:400; font-size:11px; color:#a9c2b8; margin-top:2px; }
.sidebar .nav-link{
  color:#cfe0d8; padding:11px 20px; border-left:3px solid transparent; border-radius:0; cursor:pointer; display:block; text-decoration:none;
}
.sidebar .nav-link:hover{ background:rgba(255,255,255,.06); color:#fff; }
.sidebar .nav-link.active{ background:rgba(255,255,255,.1); color:#fff; font-weight:600; border-left-color:#9fd6bb; }
.sidebar-foot{ padding:14px 20px; font-size:11px; color:#7ea295; }
.content{ flex:1; min-width:0; padding:28px 34px; max-width:1180px; }
.card-app{ background:#fff; border:1px solid #dfe3e0; border-radius:6px; padding:20px; margin-bottom:18px; }
.kpi{ font-size:26px; font-weight:700; }
.kpi-card{ position:relative; padding-top:18px; }
.kpi-card .kpi-icon{
  position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center;
  justify-content:center; font-size:15px;
}
.kpi-card.kpi-alert .kpi-icon{ background:#f5e4de; color:#a3402a; }
.kpi-card.kpi-alert .kpi{ color:#a3402a; }
.badge-devis{ background:#eef1e6; color:#5a6b3a; }
.badge-bl{ background:#e3edf3; color:#2c5a76; }
.badge-facture{ background:var(--accent-soft); color:var(--accent-dark); }
.badge-brouillon{ background:#f1ede3; color:#8a6d2f; }
.badge-valide{ background:var(--accent-soft); color:var(--accent-dark); }
.badge-converti{ background:#eee; color:#888; }
.stock-low{ color:#a3402a; font-weight:600; }
.btn-accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-accent:hover{ background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
.btn-outline-accent{ background:#fff; border:1px solid var(--accent); color:var(--accent); }
.btn-outline-accent:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); }
table.table-app{ font-size:13.5px; }
table.table-app th{ font-weight:600; color:#4b564f; border-bottom-width:1px; white-space:nowrap; }
.doc-preview{ background:#fff; border:1px solid #dfe3e0; border-radius:6px; padding:30px; max-width:800px; margin:0 auto; }
.doc-preview table{ font-size:13.5px; }
@media print{
  .sidebar, .no-print, #toastZone{ display:none !important; }
  .content{ padding:0; max-width:100%; }
  body{ background:#fff; }
  .doc-preview{ border:none; padding:0; }
}
@media (max-width: 820px){
  #wrapper{ flex-direction:column; }
  .sidebar{ width:100%; min-height:auto; flex-direction:row !important; overflow-x:auto; padding:10px; white-space:nowrap; }
  .sidebar-brand, .sidebar-foot{ display:none; }
  .sidebar .flex-grow-1{ display:none; }
  .sidebar .nav-link{ display:inline-block; border-left:none; border-bottom:3px solid transparent; padding:9px 12px; font-size:13px; }
  .sidebar .nav-link.active{ border-bottom-color:#9fd6bb; }
  .content{ padding:14px; }
  .kpi{ font-size:21px; }
}
#toastZone{ position:fixed; top:14px; right:14px; z-index:2000; max-width:340px; }
</style>
</head>

6"],[2444,"BELQERCH JAMAL","","","","3421900202",""],[2445,"MEHDI LYAZIDI","","","","3421900203",""],[2446,"STE AISLINN","","","","3421900204","003176489000091"],[2447,"SECOND WORK","","","","3421900205","003433658000051"],[2448,"MTILOUINI FATIHA","","","","3421900206",""],[2449,"SARL DALAGRI","","","","3421900207","000038214000011"],[2450,"NATURE BIOLIFE","","","","3421900208",""],[2451,"ACCESSOIR ANAS","","","","3421900209",""],[2452,"BRAHIM AMZIL","","","","3421900210",""],[2453,"ABC MUSIC","","","","3421900660","002734439000048"],[2454,"MLM","","","","3421905380",""],[2455,"EKIP EXPO INTERNATIONAL","","","","3421911200",""],[2456,"ASNAF CONSTRUCTION","","","","3421911202","000194701000085"],[2457,"M. THOMSIN FREDERIC CHRISTIAN","","","","3421911203",""],[2458,"MR SAID RACHID","","","","3421911204",""],[2459,"M.HAMZA HANAOUI","","","","3421911205",""],[2460,"STE REVOSTYLE","","","","3421911206","002666359000058"],[2461,"STE INNOVATION BUILDING SOLUTION","","","","3421911207","001550079000069"],[2462,"A MED CONCEPT SARL","","","","3421911208","001557757000052"],[2463,"FAAZA MARKET","","","","3421911400","003469666000066"],[2464,"STE GOLD LODING SARL AU","","","","3421911500","002403385000053"],[2465,"LOUTRA CONSTRUCTION SARL","","","","3421911600","001442935000029"],[2466,"ATLAS OPPORTUNITY","","","","3421911700","003456244000068"],[2467,"M EL YOUSSFI KARIM","","","","3421911800",""],[2468,"M TARIK TOUMI","","","","3421911900",""]];
const SEED_ENTREPRISE = {"nom": "Mon Entreprise", "adresse": "", "telephone": "", "email": "", "mentions": ""};
</script>
<script>
/* ============================================================
   Gestion Commerciale — version autonome (localStorage)
   Reproduit la logique de l'application Flask/SQLite d'origine.
   ============================================================ */

const TYPES_LABELS = {devis:"Devis", bl:"Bon de Livraison", facture:"Facture"};
const TYPES_PREFIX = {devis:"DEV", bl:"BL", facture:"FA"};
const MODES_PAIEMENT = {espece:"Espèces", cheque:"Chèque", virement:"Virement bancaire"};

/* ---------------- Stockage (remplace SQLite) ---------------- */
const DB_KEY = "gc_data_v1";

function loadDB(){
  let raw = localStorage.getItem(DB_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fallthrough vers seed */ }
  }
  // Première utilisation : on amorce avec les données importées
  const clients = SEED_CLIENTS.map(c => ({
    id:c[0], nom:c[1], telephone:c[2], adresse:c[3], ville:c[4], compte:c[5], ice:c[6]
  }));
  const db = {
    produits: [],
    clients: clients,
    documents: [],
    lignes: [],
    compteurs: {devis:0, bl:0, facture:0},
    entreprise: Object.assign({nom:"Mon Entreprise", adresse:"", telephone:"", email:"", mentions:""}, SEED_ENTREPRISE || {}),
    next_id: {produits:1, clients: (clients.reduce((m,c)=>Math.max(m,c.id),0)+1), documents:1, lignes:1}
  };
  saveDB(db);
  return db;
}

let DB = loadDB();

function saveDB(db){
  db = db || DB;
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function nextId(kind){
  const id = DB.next_id[kind]++;
  return id;
}

/* ---------------- Utilitaires ---------------- */
function toFloat(v, def=0){ const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? def : n; }
function toInt(v, def=0){ const n = parseInt(v, 10); return isNaN(n) ? def : n; }
function eur(v){
  v = v || 0;
  return v.toLocaleString("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2}) + " DH";
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad4(n){ return String(n).padStart(4,"0"); }

function toast(msg, category="success"){
  const map = {success:"success", danger:"danger", warning:"warning"};
  const el = document.createElement("div");
  el.className = `alert alert-${map[category]||"secondary"} alert-dismissible fade show shadow-sm`;
  el.role = "alert";
  el.innerHTML = `${esc(msg)}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
  document.getElementById("toastZone").appendChild(el);
  setTimeout(()=>{ el.classList.remove("show"); el.remove(); }, 5000);
}

/* ---------------- Logique métier (miroir de app.py) ---------------- */
function nextNumero(docType){
  DB.compteurs[docType] = (DB.compteurs[docType]||0) + 1;
  return `${TYPES_PREFIX[docType]}-${pad4(DB.compteurs[docType])}`;
}

function getProduit(id){ return DB.produits.find(p => p.id === id); }
function getClient(id){ return DB.clients.find(c => c.id === id); }
function getDocument(id){ return DB.documents.find(d => d.id === id); }
function lignesOf(docId){ return DB.lignes.filter(l => l.document_id === docId); }

function verifierStockDisponible(lignes){
  for(const l of lignes){
    const p = getProduit(l.produit_id);
    if(!p) return {ok:false, msg:"Un des produits sélectionnés n'existe plus dans le stock."};
    if(p.quantite < l.quantite) return {ok:false, msg:`Stock insuffisant pour « ${p.designation} » (disponible : ${p.quantite}).`};
  }
  return {ok:true, msg:""};
}
function deduireStock(lignes){ for(const l of lignes){ const p=getProduit(l.produit_id); if(p) p.quantite -= l.quantite; } }
function restaurerStock(lignes){ for(const l of lignes){ if(l.produit_id!=null){ const p=getProduit(l.produit_id); if(p) p.quantite += l.quantite; } } }

function genererDocumentDepuisDevis(devis, nouveauType, modePaiement, deduireStockFlag){
  const lignesSrc = lignesOf(devis.id);
  const lignesStock = lignesSrc.filter(l=>l.produit_id!=null).map(l=>({produit_id:l.produit_id, quantite:l.quantite, prix_unitaire:l.prix_unitaire}));
  if(deduireStockFlag){
    const chk = verifierStockDisponible(lignesStock);
    if(!chk.ok) return {ok:false, msg:chk.msg};
  }
  const numero = nextNumero(nouveauType);
  const newId = nextId("documents");
  DB.documents.push({
    id:newId, type:nouveauType, numero, date: todayISO(), client_id: devis.client_id,
    tva_rate: devis.tva_rate, total_ht: devis.total_ht, total_ttc: devis.total_ttc,
    statut:"valide", converti_de: devis.id, notes: devis.notes,
    mode_paiement: modePaiement || null, stock_deduit: !!deduireStockFlag, cree_le: new Date().toISOString()
  });
  for(const l of lignesSrc){
    DB.lignes.push({id: nextId("lignes"), document_id:newId, produit_id:l.produit_id, designation:l.designation, prix_unitaire:l.prix_unitaire, quantite:l.quantite});
  }
  if(deduireStockFlag) deduireStock(lignesStock);
  devis.statut = "converti";
  return {ok:true, id:newId, numero};
}

function devisStockDejaDeduit(devisId){
  return DB.documents.some(d => d.converti_de === devisId && d.stock_deduit);
}

function documentCreer(form){
  const docType = form.type;
  if(!TYPES_LABELS[docType]) return {ok:false, msg:"Type de document invalide."};
  if(!form.client_id) return {ok:false, msg:"Veuillez sélectionner un client."};
  const lignes = form.lignes.filter(l => l.produit_id && l.quantite > 0);
  if(lignes.length === 0) return {ok:false, msg:"Veuillez ajouter au moins un article."};

  if(docType === "bl" || docType === "facture"){
    const chk = verifierStockDisponible(lignes);
    if(!chk.ok) return {ok:false, msg:chk.msg};
  }
  const tvaRate = toFloat(form.tva_rate, 20);
  const totalHt = lignes.reduce((s,l)=> s + l.quantite*l.prix_unitaire, 0);
  const totalTtc = totalHt * (1 + tvaRate/100);
  const numero = nextNumero(docType);
  const statut = (docType === "bl" || docType === "facture") ? "valide" : "brouillon";
  const modePaiement = (docType === "facture" && MODES_PAIEMENT[form.mode_paiement]) ? form.mode_paiement : null;
  const docId = nextId("documents");
  DB.documents.push({
    id:docId, type:docType, numero, date: form.date || todayISO(), client_id: toInt(form.client_id),
    tva_rate: tvaRate, total_ht: totalHt, total_ttc: totalTtc, statut, converti_de:null,
    notes: form.notes || "", mode_paiement: modePaiement, cree_le: new Date().toISOString()
  });
  for(const l of lignes){
    const prod = getProduit(l.produit_id);
    DB.lignes.push({id: nextId("lignes"), document_id:docId, produit_id:l.produit_id, designation: prod?prod.designation:"Produit", prix_unitaire:l.prix_unitaire, quantite:l.quantite});
  }
  if(docType === "bl" || docType === "facture") deduireStock(lignes);
  DB.documents.find(d=>d.id===docId).stock_deduit = (docType === "bl" || docType === "facture");
  saveDB();

  // Remarque : un devis ne déclenche plus la génération automatique d'un
  // BL/Facture ni la sortie de stock. Le stock n'est déduit qu'au moment
  // où un Bon de Livraison est réellement créé (directement ou via la
  // conversion manuelle d'un devis) ; une Facture qui suit ne déduit rien
  // de plus si le BL correspondant l'a déjà fait.
  return {ok:true, id:docId, numero, msg:`${TYPES_LABELS[docType]} ${numero} enregistré avec succès.`};
}

function documentConvertir(docId, nouveauType, modePaiement){
  const devis = getDocument(docId);
  if(!devis || devis.type !== "devis") return {ok:false, msg:"Document introuvable ou n'est pas un devis."};
  if(nouveauType !== "facture" || !MODES_PAIEMENT[modePaiement]) modePaiement = null;
  const deduireStockFlag = !devisStockDejaDeduit(docId);
  const res = genererDocumentDepuisDevis(devis, nouveauType, modePaiement, deduireStockFlag);
  if(!res.ok) return res;
  saveDB();
  return {ok:true, id:res.id, msg:`Devis converti en ${TYPES_LABELS[nouveauType]} ${res.numero}.`};
}

function documentSupprimer(docId){
  const doc = getDocument(docId);
  if(!doc) return {ok:false, msg:"Document introuvable."};
  const lignes = lignesOf(docId);
  if(doc.stock_deduit){
    restaurerStock(lignes);
  }
  DB.lignes = DB.lignes.filter(l => l.document_id !== docId);
  DB.documents = DB.documents.filter(d => d.id !== docId);
  saveDB();
  return {ok:true, msg:"Document supprimé et stock restauré si nécessaire."};
}

function statutTransaction(doc){
  if(doc.type === "devis") return doc.statut === "converti" ? "Converti" : "En attente";
  return {facture:"Payé", bl:"Livré"}[doc.type] || doc.type;
}

/* ---------------- Routeur ---------------- */
function route(){
  const raw = location.hash.replace(/^#\/?/, "");
  const hash = raw.split("?")[0];
  const parts = hash.split("/").filter(Boolean);
  document.querySelectorAll(".sidebar .nav-link").forEach(a => a.classList.remove("active"));
  let page = parts[0] || "dashboard";

  if(page === "dashboard"){ setActive("dashboard"); renderDashboard(); }
  else if(page === "produits"){ setActive("produits"); renderProduits(); }
  else if(page === "clients"){ setActive("clients"); renderClients(); }
  else if(page === "documents" && parts[1] === "nouveau"){ setActive("nouveau"); renderNouveauDocument(); }
  else if(page === "documents" && parts[1]){ setActive("documents"); renderVoirDocument(toInt(parts[1])); }
  else if(page === "documents"){ setActive("documents"); renderDocumentsListe(); }
  else if(page === "parametres"){ setActive("parametres"); renderParametres(); }
  else { setActive("dashboard"); renderDashboard(); }
  window.scrollTo(0,0);
}
function setActive(route){ const a = document.querySelector(`.sidebar .nav-link[data-route="${route}"]`); if(a) a.classList.add("active"); }
window.addEventListener("hashchange", route);

/* ---------------- Vues ---------------- */
const app = () => document.getElementById("app");

function bornesPeriode(periode){
  const today = new Date();
  const iso = d => d.toISOString().slice(0,10);
  if(periode === "jour") return [iso(today), iso(today), "jour"];
  if(periode === "annee") return [iso(new Date(today.getFullYear(),0,1)), iso(today), "mois"];
  return [iso(new Date(today.getFullYear(), today.getMonth(), 1)), iso(today), "jour"];
}

function renderDashboard(){
  const periode = new URLSearchParams(location.hash.split("?")[1]||"").get("periode") || "mois";
  const [dateDebut, dateFin] = bornesPeriode(periode);

  const nbProduits = DB.produits.length;
  const nbClients = DB.clients.length;
  const devisIds = new Set(DB.documents.filter(d=>d.type==="devis").map(d=>d.id));
  const convertisDe = new Set(DB.documents.filter(d=>d.converti_de!=null).map(d=>d.converti_de));
  const nbDevisAttente = [...devisIds].filter(id => !convertisDe.has(id)).length;
  const stockFaible = DB.produits.filter(p => p.quantite <= 5).sort((a,b)=>a.quantite-b.quantite);

  const facturesPeriode = DB.documents.filter(d => d.type==="facture" && d.date>=dateDebut && d.date<=dateFin);
  const nbCommandes = facturesPeriode.length;

  const caTotal = DB.documents.filter(d=>d.type==="facture").reduce((s,d)=>s+d.total_ttc,0);

  const dernieres = [...DB.documents].sort((a,b)=>b.id-a.id).slice(0,5);

  app().innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 class="m-0">Tableau de bord</h4>
      <div class="btn-group btn-group-sm no-print">
        ${["jour","mois","annee"].map(p=>`<button class="btn ${p===periode?'btn-accent':'btn-outline-accent'}" onclick="location.hash='dashboard?periode=${p}'">${p==='jour'?'Aujourd’hui':p==='mois'?'Ce mois':'Cette année'}</button>`).join("")}
      </div>
    </div>
    <div class="row g-3 mb-2">
      <div class="col-6 col-md-3"><div class="card-app kpi-card"><div class="kpi-icon"><i class="fa-solid fa-boxes-stacked"></i></div><div class="text-muted small">Produits en stock</div><div class="kpi">${nbProduits}</div></div></div>
      <div class="col-6 col-md-3"><div class="card-app kpi-card"><div class="kpi-icon"><i class="fa-solid fa-users"></i></div><div class="text-muted small">Clients</div><div class="kpi">${nbClients}</div></div></div>
      <div class="col-6 col-md-3"><div class="card-app kpi-card"><div class="kpi-icon"><i class="fa-solid fa-file-invoice"></i></div><div class="text-muted small">Devis en attente</div><div class="kpi">${nbDevisAttente}</div></div></div>

    <div class="row g-3 mb-2">
      <div class="col-6 col-md-4"><div class="card-app"><div class="text-muted small">CA facturé (période)</div><div class="kpi">${eur(caPeriode)}</div></div></div>

function renderProduits(){

  const rows = (q ? DB.produits.filter(p=>p.designation.toLowerCase().includes(q)) : DB.produits)

const COLONNES_ACCEPTEES_PRODUITS = {
  designation:["designation","désignation","nom","produit","article","nom produit","nom article","libelle","libellé"],
  prix_achat:["prix achat","prix d'achat","prixachat","achat","pa","prix achat ht"],
  prix_vente:["prix vente","prix de vente","prixvente","vente","pv","prix vente ht","prix"],
  quantite:["quantite","quantité","qte","qté","stock","quantite stock","qte stock"]
};
function trouverColonneGenerique(colonnes, champ, table){
  const candidats = new Set(table[champ].map(normaliser));
  for(const c of colonnes){ if(candidats.has(normaliser(c))) return c; }
  return null;
}
function importerProduitsExcel(file){
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const wb = XLSX.read(evt.target.result, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if(!rows.length){ toast("Fichier vide ou illisible.","danger"); return; }
      const colonnes = Object.keys(rows[0]);
      const colDes = trouverColonneGenerique(colonnes, "designation", COLONNES_ACCEPTEES_PRODUITS);
      if(!colDes){ toast("Colonne de désignation introuvable (attendu : « Désignation », « Nom » ou « Article »).","danger"); return; }
      const colAchat = trouverColonneGenerique(colonnes, "prix_achat", COLONNES_ACCEPTEES_PRODUITS);
      const colVente = trouverColonneGenerique(colonnes, "prix_vente", COLONNES_ACCEPTEES_PRODUITS);
      const colQte = trouverColonneGenerique(colonnes, "quantite", COLONNES_ACCEPTEES_PRODUITS);
      let inseres=0, doublons=0, vides=0;
      for(const ligne of rows){
        const designation = String(ligne[colDes]||"").trim();
        if(!designation || designation.toLowerCase()==="nan" || designation==="*"){ vides++; continue; }
        const dejaPresent = DB.produits.some(p=>p.designation.toLowerCase()===designation.toLowerCase());
        if(dejaPresent){ doublons++; continue; }
        DB.produits.push({
          id: nextId("produits"), designation,
          prix_achat: colAchat ? toFloat(ligne[colAchat]) : 0,
          prix_vente: colVente ? toFloat(ligne[colVente]) : 0,
          quantite: colQte ? toInt(ligne[colQte]) : 0
        });
        inseres++;
      }
      saveDB();
      let msg = `Import terminé : ${inseres} produit(s) importé(s).`;
      if(doublons) msg += ` ${doublons} déjà présent(s) ignoré(s) (même désignation).`;
      if(vides) msg += ` ${vides} ligne(s) sans désignation ignorée(s).`;
      toast(msg, inseres?"success":"warning");
      renderProduits();
    }catch(err){ toast("Impossible de lire le fichier Excel : "+err.message, "danger"); }
  };
  reader.readAsArrayBuffer(file);
}

function prodSupprimer(id){
  const utilise = DB.lignes.some(l => l.produit_id === id);
  if(utilise){ toast("Impossible de supprimer : ce produit apparaît dans un ou plusieurs documents.","danger"); return; }
  if(!confirm("Supprimer ce produit ?")) return;
  DB.produits = DB.produits.filter(p=>p.id!==id); saveDB(); toast("Produit supprimé."); renderProduits();

const COLONNES_ACCEPTEES = {
  compte:["compte","code compte"], nom:["intitule","intitulé","nom","nom client","client","raison sociale"],
  ice:["identifiant commun","ice"], telephone:["telephone","téléphone","tel","tél","gsm","mobile"],
  adresse:["adresse"], ville:["ville"]
};
function normaliser(t){ return String(t).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase(); }
function trouverColonne(colonnes, champ){
  const candidats = new Set(COLONNES_ACCEPTEES[champ].map(normaliser));
  for(const c of colonnes){ if(candidats.has(normaliser(c))) return c; }
  return null;
}
function importerClientsExcel(file){
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const wb = XLSX.read(evt.target.result, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if(!rows.length){ toast("Fichier vide ou illisible.","danger"); return; }
      const colonnes = Object.keys(rows[0]);
      const colNom = trouverColonne(colonnes, "nom");
      if(!colNom){ toast("Colonne du nom du client introuvable (attendu : « Nom », « Intitulé » ou « Raison sociale »).","danger"); return; }
      const colCompte = trouverColonne(colonnes,"compte"), colIce = trouverColonne(colonnes,"ice"),
            colTel = trouverColonne(colonnes,"telephone"), colAdresse = trouverColonne(colonnes,"adresse"), colVille = trouverColonne(colonnes,"ville");
      const PREFIXE = "3421", CHAPEAU = "3421000000";
      let inseres=0, doublons=0, vides=0;
      for(const ligne of rows){
        const nom = String(ligne[colNom]||"").trim();
        const compte = colCompte ? String(ligne[colCompte]||"").trim() : "";
        if(colCompte && (!compte.startsWith(PREFIXE) || compte===CHAPEAU)) continue;
        if(!nom || nom.toLowerCase()==="nan" || nom==="*"){ vides++; continue; }
        const dejaPresent = compte
          ? DB.clients.some(c=>c.compte===compte)
          : DB.clients.some(c=>c.nom.toLowerCase()===nom.toLowerCase() && !c.compte);
        if(dejaPresent){ doublons++; continue; }
        DB.clients.push({
          id: nextId("clients"), nom,
          telephone: colTel?String(ligne[colTel]||"").trim():"",
          adresse: colAdresse?String(ligne[colAdresse]||"").trim():"",
          ville: colVille?String(ligne[colVille]||"").trim():"",
          compte: compte||"", ice: colIce?String(ligne[colIce]||"").trim():""
        });
        inseres++;
      }
      saveDB();
      let msg = `Import terminé : ${inseres} client(s) importé(s).`;
      if(doublons) msg += ` ${doublons} déjà présent(s) ignoré(s).`;
      if(vides) msg += ` ${vides} ligne(s) sans nom exploitable ignorée(s).`;
      toast(msg, inseres?"success":"warning");
      renderClients();
    }catch(err){ toast("Impossible de lire le fichier Excel : "+err.message, "danger"); }
  };
  reader.readAsArrayBuffer(file);
}

  app().querySelector('[name="type"]').addEventListener("change", e=>{
    app().querySelector("#modePaiementWrap").style.display = e.target.value==="facture" ? "block" : "none";
  });
  addLigne();

  document.getElementById("fDoc").addEventListener("submit", e=>{
    e.preventDefault();
    const f = e.target;
    const lignes = [];
    tbody.querySelectorAll("tr").forEach(tr=>{
      const pid = tr.querySelector(".sel-prod").value;
      const qte = toInt(tr.querySelector(".inp-qte").value);
      const prix = toFloat(tr.querySelector(".inp-prix").value);
      if(pid && qte>0) lignes.push({produit_id: toInt(pid), quantite: qte, prix_unitaire: prix});
    });
    const res = documentCreer({
      type: f.type.value, client_id: f.client_id.value, date: f.date.value,
      tva_rate: f.tva_rate.value, notes: f.notes.value, mode_paiement: f.mode_paiement ? f.mode_paiement.value : null,
      lignes
    });
    if(!res.ok){ toast(res.msg,"danger"); return; }
    toast(res.msg,"success");
    location.hash = `documents/${res.id}`;
  });
}

          <div class="small text-muted">${esc(entreprise.telephone||"")} ${entreprise.email?(' · '+esc(entreprise.email)):''}</div>
        </div>
        <div class="text-end">
          <h5>${TYPES_LABELS[doc.type]} ${esc(doc.numero)}</h5>

      <table class="table table-app">

        <tbody>
          ${lignes.map(l=>`<tr><td>${esc(l.designation)}</td><td class="text-end">${l.quantite}</td><td class="text-end">${eur(l.prix_unitaire)}</td><td class="text-end">${eur(l.quantite*l.prix_unitaire)}</td></tr>`).join("")}

function convertirPrompt(id, type){
  let modePaiement = null;
  if(type === "facture"){
    modePaiement = prompt("Mode de paiement (espece / cheque / virement), laisser vide si inconnu :", "") || null;
    if(modePaiement && !MODES_PAIEMENT[modePaiement]) modePaiement = null;
  }
  const res = documentConvertir(id, type, modePaiement);
  toast(res.msg, res.ok?"success":"danger");
  if(res.ok) location.hash = `documents/${res.id}`;
}
function changerPaiement(id, mode){
  const doc = getDocument(id); if(!doc) return;
  if(!mode){ return; }
  if(!MODES_PAIEMENT[mode]){ toast("Mode de paiement invalide.","danger"); return; }
  doc.mode_paiement = mode; saveDB(); toast("Mode de paiement mis à jour."); renderVoirDocument(id);
}

function renderParametres(){
  const e = DB.entreprise;
  app().innerHTML = `
    <h4 class="mb-3">Paramètres de l'entreprise</h4>
    <div class="card-app" style="max-width:560px">
      <form id="fParam">
        <div class="mb-2"><label class="form-label small">Nom</label><input class="form-control form-control-sm" name="nom" value="${esc(e.nom)}"></div>
        <div class="mb-2"><label class="form-label small">Adresse</label><input class="form-control form-control-sm" name="adresse" value="${esc(e.adresse)}"></div>
        <div class="mb-2"><label class="form-label small">Téléphone</label><input class="form-control form-control-sm" name="telephone" value="${esc(e.telephone)}"></div>
        <div class="mb-2"><label class="form-label small">Email</label><input class="form-control form-control-sm" name="email" value="${esc(e.email)}"></div>
        <div class="mb-3"><label class="form-label small">Mentions légales (pied de document)</label><textarea class="form-control form-control-sm" name="mentions" rows="3">${esc(e.mentions)}</textarea></div>
        <button class="btn btn-accent btn-sm">Enregistrer</button>
      </form>
    </div>
    <div class="card-app mt-3" style="max-width:560px">
      <h6>Sauvegarde des données</h6>
      <p class="small text-muted">Toutes les données (stock, clients, documents) sont stockées uniquement sur cet appareil / ce navigateur. Exportez régulièrement une copie de sécurité.</p>
      <button class="btn btn-sm btn-outline-accent me-2" onclick="exporterSauvegarde()"><i class="fa-solid fa-download me-1"></i>Exporter (.json)</button>
      <label class="btn btn-sm btn-outline-accent mb-0">
        <i class="fa-solid fa-upload me-1"></i>Restaurer
        <input type="file" id="fileRestore" accept=".json" hidden>
      </label>
    </div>
  `;
  document.getElementById("fParam").addEventListener("submit", ev=>{
    ev.preventDefault(); const f=ev.target;
    Object.assign(DB.entreprise, {nom:f.nom.value.trim(), adresse:f.adresse.value.trim(), telephone:f.telephone.value.trim(), email:f.email.value.trim(), mentions:f.mentions.value.trim()});
    saveDB(); toast("Informations de l'entreprise mises à jour.");
  });
  document.getElementById("fileRestore").addEventListener("change", ev=>{
    const file = ev.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e2 => {
      try{
        const data = JSON.parse(e2.target.result);
        if(!data || typeof data !== "object" || !Array.isArray(data.documents)){
          toast("Fichier de sauvegarde invalide.","danger"); return;
        }
        if(!confirm("Cela remplacera toutes les données actuelles par celles du fichier. Continuer ?")) return;
        data.produits = data.produits || [];
        data.clients = data.clients || [];
        data.documents = data.documents || [];
        data.lignes = data.lignes || [];
        data.compteurs = Object.assign({devis:0, bl:0, facture:0}, data.compteurs || {});
        data.entreprise = Object.assign({nom:"Mon Entreprise", adresse:"", telephone:"", email:"", mentions:""}, data.entreprise || {});
        const maxId = arr => arr.reduce((m,x)=>Math.max(m, x.id||0), 0);
        data.next_id = Object.assign({
          produits: maxId(data.produits)+1, clients: maxId(data.clients)+1,
          documents: maxId(data.documents)+1, lignes: maxId(data.lignes)+1
        }, data.next_id || {});
        DB = data; saveDB(); toast("Données restaurées."); route();
      }catch(err){ toast("Fichier invalide.","danger"); }
    };
    reader.readAsText(file);
  });
}
function exporterSauvegarde(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gestion-sauvegarde-${todayISO()}.json`;
  a.click();
}

/* ---------------- Démarrage ---------------- */
if(!location.hash) location.hash = "#/dashboard";
route();

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {

    messagingSenderId: "234281414590",
    appId: "1:234281414590:web:f7d11c...",
    measurementId: "G-G798MLB5V2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, "app_data", "main_db");

  // إعادة تعريف saveDB لتشمل الحفظ السحابي تلقائياً
  const originalSaveDB = window.saveDB;
  window.saveDB = function() {
    if (typeof originalSaveDB === 'function') originalSaveDB();
    setDoc(docRef, DB).catch(err => console.error("Cloud sync error:", err));
  };

  // المزامنة اللحظية مع الأجهزة الأخرى
  let initialLoad = true;
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const cloudData = docSnap.data();
      if (JSON.stringify(cloudData) !== JSON.stringify(DB)) {
        DB = cloudData;
        localStorage.setItem("gestion_db", JSON.stringify(DB));
        if (!initialLoad) {
          toast("Mise à jour des données en direct...", "info");
          route();
        }
      }
    } else {
      setDoc(docRef, DB);
    }
    initialLoad = false;
  });
</script>
